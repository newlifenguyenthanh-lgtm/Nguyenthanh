[project]
name = "paacc-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.5", "pydantic-settings>=2.2", "uvicorn>=0.27", "sqlalchemy>=2.0", "pyjwt>=2.8", "alembic>=1.13", "pymupdf>=1.24", "openpyxl>=3.1", "pytesseract>=0.3.10", "numpy>=1.26", "pillow>=10", "python-multipart>=0.0.9", "psycopg[binary]>=3.1"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
