[project]
name = "paacc-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.5", "pydantic-settings>=2.2", "uvicorn>=0.27"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
